name: College football score predictor

on:
  schedule:
    - cron: "37 13 * * *"              # every morning (about 9 AM ET): new finals and play-by-play
    - cron: "15 22 * 8-12,1 2-6"       # Tuesday-Saturday, before the evening kickoffs
    - cron: "45 15 * 8-12,1 6"         # Saturday, before the noon ET games
    - cron: "45 18 * 8-12,1 6"         # Saturday, before the 3:30 PM ET games
    - cron: "45 1 * 8-12,1 0"          # Saturday night, before the late West Coast games
  workflow_dispatch:
    inputs:
      backtest:
        description: "Also rerun the walk-forward backtest"
        type: boolean
        default: false
  push:
    paths:
      - "CollegeFootballScorePredictor/**"
      - ".github/workflows/cfb-score-predictor.yml"

permissions:
  contents: write

concurrency:
  group: cfb-score-predictor
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: CollegeFootballScorePredictor
    env:
      # Optional: a free CollegeFootballData key gives multi-book lines; without
      # it the predictor uses ESPN's public scoreboard lines.
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CollegeFootballScorePredictor/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Check live lines
        if: github.event_name == 'push'
        continue-on-error: true
        run: python -m cfbpredictor -v check --raw 3

      - name: Update predictions
        if: github.event_name != 'push'
        run: python -m cfbpredictor -v update

      - name: Rerun backtest
        if: github.event_name == 'workflow_dispatch' && inputs.backtest
        run: python -m cfbpredictor -v backtest

      - name: Commit results
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions data
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Update college football predictions ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # The other predictors commit to the same branch, and their runs
          # often finish together; rebase and retry if one pushes first.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); retrying."
            sleep $((attempt * 5))
          done
          exit 1
