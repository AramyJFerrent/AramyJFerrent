name: NHL score predictor

on:
  schedule:
    - cron: "27 13 * 9-12,1-6 *"   # every morning (about 9:30 AM ET): last night's games, new ratings
    - cron: "27 16 * 9-12,1-6 *"   # about 12:30 PM ET, before afternoon games and after morning skates
    - cron: "12 22 * 9-12,1-6 *"   # about 6 PM ET, confirmed goalies and late lines before 7 PM games
    - cron: "52 0 * 9-12,1-7 *"    # about 9 PM ET, before the late West Coast games
  workflow_dispatch:
    inputs:
      backtest:
        description: "Also rerun the walk-forward backtest"
        type: boolean
        default: false
  push:
    paths:
      - "NHLScorePredictor/**"
      - ".github/workflows/nhl-score-predictor.yml"

permissions:
  contents: write

concurrency:
  group: nhl-score-predictor
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: NHLScorePredictor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: NHLScorePredictor/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Update predictions
        if: github.event_name != 'push'
        run: python -m nhlpredictor -v update

      - name: Rerun backtest
        if: github.event_name == 'workflow_dispatch' && inputs.backtest
        run: python -m nhlpredictor -v backtest

      - name: Commit results
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions data
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Update NHL predictions ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
