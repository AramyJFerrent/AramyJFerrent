name: NFL score predictor

on:
  schedule:
    - cron: "17 13 * * *"      # every morning (about 9 AM ET)
    - cron: "7 16 * * 0"       # Sunday, before the 1 PM ET kickoffs
    - cron: "7 23 * * 0,1,4"   # before Sunday, Monday and Thursday night games
  workflow_dispatch:
    inputs:
      backtest:
        description: "Also rerun the walk-forward backtest"
        type: boolean
        default: false
  push:
    paths:
      - "NFLScorePredictor/**"
      - ".github/workflows/nfl-score-predictor.yml"

permissions:
  contents: write

concurrency:
  group: nfl-score-predictor
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: NFLScorePredictor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: NFLScorePredictor/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Update predictions
        if: github.event_name != 'push'
        run: python -m nflpredictor -v update

      - name: Rerun backtest
        if: github.event_name == 'workflow_dispatch' && inputs.backtest
        run: python -m nflpredictor -v backtest

      - name: Commit results
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions data
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Update NFL predictions ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
