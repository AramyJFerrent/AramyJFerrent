name: MLB score predictor

on:
  schedule:
    - cron: "33 13 * 3-11 *"     # about 9:30 AM ET: last night's box scores, new ratings, probable pitchers
    - cron: "33 16 * 3-11 *"     # about 12:30 PM ET: lineups for the afternoon games
    - cron: "33 20 * 3-11 *"     # about 4:30 PM ET: lineups and late lines for the 7 PM games
    - cron: "33 22 * 3-11 *"     # about 6:30 PM ET: the rest of the evening lineups
    - cron: "3 1 * 3-11 *"       # about 9 PM ET, before the late West Coast games
    - cron: "33 14 * 12,1,2 1"   # Mondays in the off-season: new schedule, Retrosheet's finished season
  workflow_dispatch:
    inputs:
      backtest:
        description: "Also rerun the walk-forward backtest"
        type: boolean
        default: false
  push:
    paths:
      - "MLBScorePredictor/**"
      - "BettingCore/**"
      - ".github/workflows/mlb-score-predictor.yml"

permissions:
  contents: write

concurrency:
  group: mlb-score-predictor
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: MLBScorePredictor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            MLBScorePredictor/requirements.txt
            BettingCore/pyproject.toml

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

      # On pushes, read the live sources and run a full update without
      # committing, so a change shows whether the MLB Stats API, ESPN and
      # Open-Meteo still read cleanly, the season's data checks out against
      # last season's, and the predictions page builds.
      - name: Check live sources
        if: github.event_name == 'push'
        run: python -m mlbpredictor -v check --raw

      - name: Update predictions
        run: python -m mlbpredictor -v update

      - name: Audit this season's data
        if: github.event_name == 'push'
        run: python -m mlbpredictor audit

      - name: Show the predictions page
        if: github.event_name == 'push'
        run: head -c 6000 predictions/README.md

      - name: Rerun backtest
        if: github.event_name == 'workflow_dispatch' && inputs.backtest
        run: python -m mlbpredictor -v backtest

      - name: Commit results
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions data
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Update MLB predictions ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # The other predictors commit to the same branch, and their runs
          # often finish together; rebase and retry if one pushes first.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); retrying."
            sleep $((attempt * 5))
          done
          exit 1
